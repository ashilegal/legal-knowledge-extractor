[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "legal-knowledge-extractor"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "pymupdf>=1.24",
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "typer>=0.12",
    "rich>=13.0",
    "tenacity>=8.2",
    "regex>=2024.0",
    "rapidfuzz>=3.0",
    "anthropic>=1.11",
]

[project.optional-dependencies]
ocr = ["ocrmypdf>=16.0"]
search = ["sentence-transformers>=3.0"]
dev = ["pytest>=8.0"]

[project.scripts]
lke = "lke.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
